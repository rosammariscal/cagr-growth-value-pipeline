[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cagr-growth-value-pipeline"
version = "0.2.0"
description = "Systematic growth/value equity screen built on yfinance fundamentals"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rosa María Mariscal Romero" }]
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "yfinance>=0.2.40",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/rosammariscal/cagr-growth-value-pipeline"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
